spring:
  application:
    name: prefab.showcase-mongodb
  kafka:
    properties:
      # Avro events (payments, shipments) need a schema registry next to Kafka
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  data:
    mongodb:
      auto-index-creation: true

error.handling:
  exception-logging: WITH_STACKTRACE
