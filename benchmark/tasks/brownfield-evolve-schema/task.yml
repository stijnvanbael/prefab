title: Add a required field to an aggregate whose table already holds data
category: brownfield-schema
tier: brownfield
base: shop
timeoutMinutes: 40
notes: >
  Reference: a non-null enum component with @DbDefaultValue("BRONZE"), so the generated migration adds the column
  with a default for existing rows, plus an admin-only @Update. The hidden tests read the migration scripts on the
  classpath: a NOT NULL column without a default (or a backfill) fails on a table with rows. A hand-written V2
  migration that backfills the column also passes, with a guardrail warning. The annotation reference wrongly
  suggests @DbDefaultValue("'BRONZE'"), which stores the quotes (TASK-386).
