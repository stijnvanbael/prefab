title: Concert ticket sales with organizer and buyer roles
category: feature-security
tier: feature
modules: [postgres, kafka, security]
timeoutMinutes: 45
maxTurns: 150
notes: >
  Reference: Concert (organizer-only create, public reads with @Security(enabled = false) plus an
  HttpSecurityCustomizer that permits anonymous GETs, city filter, @Computed
  remaining and soldOut) and TicketOrder (authenticated create and cancellation) linked by a sealed TicketOrderEvent
  that Concert handles @ByReference.
