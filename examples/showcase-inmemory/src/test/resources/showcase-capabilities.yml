# Capabilities this variant does not support. Every capability that is not listed is supported.
# Each gap needs a reason and the backlog task that tracks it.
#
# STREAMS is supported: the common streams slice runs on the in-process engine, wired to the in-memory event bus.
variant: showcase-inmemory
unsupported:
  KAFKA_STREAMS_BREAKOUT:
    reason: breakout hands over the Kafka Streams API, and the in-memory backend runs streams on the in-process engine
    task: TASK-374
