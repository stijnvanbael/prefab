title: Restock products automatically when their stock runs low in an existing shop
category: brownfield-feature
tier: brownfield
base: shop
timeoutMinutes: 45
notes: >
  Reference: StockLevel publishes StockRunningLow when an order takes the available stock below 5; a new
  RestockRequest aggregate is created from that event (static @EventHandler), has admin-only reads and a fulfilment
  action that publishes RestockFulfilled, which StockLevel handles with @Multicast. Spans inventory and a new
  purchasing package, two new events and security.
