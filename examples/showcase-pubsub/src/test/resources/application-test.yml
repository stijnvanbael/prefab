spring:
  flyway:
    clean-disabled: false

logging.level:
  be.appify.prefab.example: DEBUG

prefab:
  test:
    # Keep the Pub/Sub emulator and Postgres: this variant proves the real technology (TASK-175.05).
    containers: true
  flyway:
    auto-clean-on-mismatch: true
  # Pub/Sub retries with its own backoff properties (the Kafka property is initial-interval-ms). The defaults
  # (1s, growing to 30s) let a failing message outlive the test that published it. Concurrent handlers of the same
  # stock level or order history collide on the optimistic lock, so the retries must outlast that contention.
  dlt.retries:
    limit: 20
    minimum-backoff-ms: 10
    maximum-backoff-ms: 100
