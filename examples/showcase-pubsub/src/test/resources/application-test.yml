spring:
  flyway:
    clean-disabled: false

logging.level:
  be.appify.prefab.example: DEBUG

prefab:
  flyway:
    auto-clean-on-mismatch: true
  # Pub/Sub retries with its own backoff properties (the Kafka property is initial-interval-ms). The defaults
  # (1s, growing to 30s) let a failing message outlive the test that published it.
  dlt.retries:
    minimum-backoff-ms: 10
    maximum-backoff-ms: 100
